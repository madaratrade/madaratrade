networks:
  ammighorbani:
    name: ammighorbani

volumes:
  ammighorbani-data:
  mysql_data:
  mongo_data:

services:
  

   
  nginx:
    image: nginx:alpine
    container_name: ammighorbani-nginx
    restart: always
    ports:
      - 80:80
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    extra_hosts:
        - "host.docker.internal:host-gateway"

  php:
    build: ./php
    container_name: ammighorbani-php
    volumes:
      - ./src:/var/www/html
    depends_on:
      - nginx
        
  fastapi:
    build: ./python
    container_name: ammighorbani-fastapi
    restart: always
    ports:
      - 8000:8000
    volumes:
      - ./python:/app
    depends_on:
      - mongodb
      - redis

  mysql:
    image: mysql:8.0
    container_name: ammighorbani-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Ammighorbani12
      MYSQL_DATABASE: messenger
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:7
    container_name: ammighorbani-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: ammighorbani-redis
    restart: always
    ports:
      - "6379:6379"
